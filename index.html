<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Browser IP-KVM Console</title>
  <style>
    body {
      margin: 0;
      background: #0f1117;
      color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #toolbar {
      padding: 6px 14px;
      background: #181b24;
      display: flex;
      gap: 12px;
      align-items: center;
      border-bottom: 1px solid #272b38;
      height: 38px;
      box-sizing: border-box;
    }
    #viewport {
      width: 100vw;
      height: calc(100vh - 38px);
      object-fit: contain;
      background: #000;
      cursor: crosshair;
      display: block;
    }
    
    .slot {
      display: inline-flex;
      align-items: center;
    }

    .btn {
      background: #252a38;
      color: #e2e8f0;
      border: 1px solid #3b4256;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease-in-out;
      user-select: none;
    }
    .btn:hover {
      background: #32384a;
      border-color: #4f5874;
      color: #fff;
    }
    .btn:active {
      transform: scale(0.98);
    }

    /* Modal Backdrop and Dialog */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-dialog {
      background: #181b24;
      border: 1px solid #2e3446;
      border-radius: 12px;
      padding: 20px;
      width: 460px;
      max-width: 90vw;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      transform: scale(0.95);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .modal-backdrop.open .modal-dialog {
      transform: scale(1);
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .modal-title {
      font-size: 16px;
      font-weight: 600;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .modal-desc {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    .device-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 280px;
      overflow-y: auto;
      margin-bottom: 16px;
    }
    .device-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 14px;
      background: #222634;
      border: 1px solid #33394c;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: left;
    }
    .device-item:hover {
      background: #2d3345;
      border-color: #6366f1;
      color: #fff;
    }
    .device-item.recommended {
      border-color: rgba(99, 102, 241, 0.6);
      background: rgba(99, 102, 241, 0.12);
    }
    .device-name {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .badge-rec {
      font-size: 10px;
      text-transform: uppercase;
      padding: 2px 7px;
      background: #4f46e5;
      color: #fff;
      border-radius: 4px;
      font-weight: 600;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    .btn-cancel {
      background: transparent;
      color: #94a3b8;
      border: 1px solid #3b4256;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-cancel:hover {
      background: #252a38;
      color: #fff;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      user-select: none;
      transition: all 0.2s ease;
    }
    .status-badge.connected {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
    }
    .status-badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.8);
      display: inline-block;
      flex-shrink: 0;
    }
    .pulse {
      animation: pulse-dot 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .btn-icon {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      padding: 2px 4px;
      font-size: 13px;
      line-height: 1;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 2px;
      transition: all 0.15s;
    }
    .btn-icon:hover {
      color: #f87171;
      background: rgba(248, 113, 113, 0.15);
    }

    .kvm-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      user-select: none;
    }
    .kvm-badge.locked {
      background: rgba(99, 102, 241, 0.15);
      border-color: rgba(99, 102, 241, 0.4);
      color: #a5b4fc;
    }

    #echo-status {
      color: #4ade80;
      margin-left: auto;
      max-width: 45%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 12px;
      font-family: "SF Mono", Consolas, "Liberation Mono", Menlo, Courier, monospace;
    }

    /* Popup Toast Notification */
    #toastContainer {
      position: fixed;
      top: 50px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 280px;
      max-width: 420px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      background: #1c1924;
      border-left: 4px solid #ef4444;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 2px 8px rgba(0, 0, 0, 0.4);
      opacity: 0;
      transform: translateX(40px);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .toast.show {
      opacity: 1;
      transform: translateX(0);
    }
    .toast-icon {
      font-size: 18px;
      flex-shrink: 0;
    }
    .toast-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .toast-title {
      font-weight: 600;
      color: #fca5a5;
    }
    .toast-msg {
      font-size: 12px;
      color: #cbd5e1;
    }
    .toast-close {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
      border-radius: 4px;
      line-height: 1;
    }
    .toast-close:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
    }
  </style>
</head>
<body>
  <div id="toastContainer"></div>
  <div id="toolbar">
    <!-- RP2350 Serial Slot -->
    <div id="serialSlot" class="slot">
      <button id="btnConnectSerial" class="btn">
        <span>🔌</span> Connect RP2350 Serial
      </button>
      <div id="serialStatusBadge" class="status-badge connected" style="display: none;">
        <span class="dot pulse"></span>
        <span id="serialStatusText">RP2350: Connected</span>
        <button id="btnDisconnectSerial" class="btn-icon" title="Disconnect Serial">✕</button>
      </div>
    </div>

    <!-- UVC Video Stream Slot -->
    <div id="videoSlot" class="slot">
      <button id="btnStartVideo" class="btn">
        <span>📹</span> Start Video Stream
      </button>
      <div id="videoStatusBadge" class="status-badge connected" style="display: none;">
        <span class="dot pulse"></span>
        <span id="videoStatusText">Video: Streaming</span>
        <button id="btnStopVideo" class="btn-icon" title="Stop Video">✕</button>
      </div>
    </div>

    <!-- KVM Input Focus Indicator -->
    <div id="kvmIndicator" class="kvm-badge" style="display: none;">
      <span id="kvmLockIcon">🎮</span>
      <span id="kvmLockText">Click video to focus KVM</span>
    </div>

    <span id="echo-status"></span>
  </div>

  <!-- Device Selection Modal -->
  <div id="videoModalBackdrop" class="modal-backdrop">
    <div class="modal-dialog">
      <div class="modal-header">
        <div class="modal-title"><span>📹</span> Select Video Device (UVC)</div>
        <button id="btnModalClose" class="btn-icon" title="Close">✕</button>
      </div>
      <div class="modal-desc">Select the video input / UVC capture card you would like to stream:</div>
      <div id="deviceListContainer" class="device-list"></div>
      <div class="modal-footer">
        <button id="btnModalCancel" class="btn-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <video id="viewport" autoplay playsinline muted></video>

  <script>
    let port, writer, reader;
    let currentStream = null;

    const videoEl = document.getElementById('viewport');
    const echoStatusEl = document.getElementById('echo-status');

    // UI Elements
    const btnConnectSerial = document.getElementById('btnConnectSerial');
    const serialStatusBadge = document.getElementById('serialStatusBadge');
    const serialStatusText = document.getElementById('serialStatusText');
    const btnDisconnectSerial = document.getElementById('btnDisconnectSerial');

    const btnStartVideo = document.getElementById('btnStartVideo');
    const videoStatusBadge = document.getElementById('videoStatusBadge');
    const videoStatusText = document.getElementById('videoStatusText');
    const btnStopVideo = document.getElementById('btnStopVideo');

    const videoModalBackdrop = document.getElementById('videoModalBackdrop');
    const deviceListContainer = document.getElementById('deviceListContainer');
    const btnModalClose = document.getElementById('btnModalClose');
    const btnModalCancel = document.getElementById('btnModalCancel');

    const kvmIndicator = document.getElementById('kvmIndicator');
    const kvmLockText = document.getElementById('kvmLockText');

    // -------------------------------------------------------------------------
    // UI State Updaters
    // -------------------------------------------------------------------------
    function updateSerialUI(connected, detail) {
      if (connected) {
        btnConnectSerial.style.display = 'none';
        serialStatusBadge.style.display = 'inline-flex';
        serialStatusText.textContent = detail || 'RP2350: Connected';
      } else {
        btnConnectSerial.style.display = 'inline-flex';
        serialStatusBadge.style.display = 'none';
      }
      updateKvmVisibility();
    }

    function updateVideoUI(connected, detail) {
      if (connected) {
        btnStartVideo.style.display = 'none';
        videoStatusBadge.style.display = 'inline-flex';
        videoStatusText.textContent = detail || 'Video: Streaming';
      } else {
        btnStartVideo.style.display = 'inline-flex';
        videoStatusBadge.style.display = 'none';
      }
      updateKvmVisibility();
    }

    function updateKvmVisibility() {
      if (currentStream || port) {
        kvmIndicator.style.display = 'inline-flex';
      } else {
        kvmIndicator.style.display = 'none';
      }
    }

    // -------------------------------------------------------------------------
    // Toast Popup Notifications
    // -------------------------------------------------------------------------
    function showToast(title, message, isWarning = true) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = `
        <span class="toast-icon">${isWarning ? '⚠️' : 'ℹ️'}</span>
        <div class="toast-content">
          <div class="toast-title">${title}</div>
          ${message ? `<div class="toast-msg">${message}</div>` : ''}
        </div>
        <button class="toast-close" title="Close">✕</button>
      `;

      const dismiss = () => {
        toast.classList.remove('show');
        setTimeout(() => {
          if (toast.parentNode) toast.parentNode.removeChild(toast);
        }, 250);
      };

      toast.querySelector('.toast-close').addEventListener('click', dismiss);
      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.add('show');
      });

      setTimeout(dismiss, 4500);
    }

    // -------------------------------------------------------------------------
    // 1. UVC Video Capture, On-Demand Scanning & Device Selection Modal
    // -------------------------------------------------------------------------
    function openDeviceModal(devices) {
      deviceListContainer.innerHTML = '';

      devices.forEach((device, index) => {
        const isUvc = /usb|uvc|capture|cam link|hdmi/i.test(device.label);
        const item = document.createElement('button');
        item.className = 'device-item' + (isUvc ? ' recommended' : '');
        item.innerHTML = `
          <span class="device-name">📹 ${device.label || ('Video Device ' + (index + 1))}</span>
          ${isUvc ? '<span class="badge-rec">UVC Capture</span>' : ''}
        `;
        item.addEventListener('click', () => {
          closeDeviceModal();
          connectCamera(device.deviceId, device.label);
        });
        deviceListContainer.appendChild(item);
      });

      videoModalBackdrop.classList.add('open');
    }

    function closeDeviceModal() {
      videoModalBackdrop.classList.remove('open');
      btnStartVideo.innerHTML = '<span>📹</span> Start Video Stream';
      btnStartVideo.disabled = false;
    }

    btnModalClose.addEventListener('click', closeDeviceModal);
    btnModalCancel.addEventListener('click', closeDeviceModal);
    videoModalBackdrop.addEventListener('click', (e) => {
      if (e.target === videoModalBackdrop) {
        closeDeviceModal();
      }
    });

    // -------------------------------------------------------------------------
    // Camera Error Handling Helper
    // -------------------------------------------------------------------------
    function handleCameraError(err, context = 'Camera') {
      console.error(`[KVM Video] ${context} error (${err.name}):`, err);
      let title = 'Video Error';
      let msg = err.message || 'An error occurred accessing the video device.';

      if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
        title = 'No Video Device Found';
        msg = 'No UVC capture card or camera detected. Please check the USB connection.';
      } else if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError' || err.name === 'SecurityError') {
        title = 'Camera Permission Denied';
        msg = 'Please allow camera access permission in browser site settings.';
      } else if (err.name === 'NotReadableError' || err.name === 'TrackStartError') {
        title = 'Video Device In Use';
        msg = 'The video device could not be opened. It may be locked by another application.';
      } else if (err.name === 'OverconstrainedError') {
        title = 'Format Unsupported';
        msg = `The device does not support the requested video format (${err.constraint || 'constraint'}).`;
      } else if (err.name === 'AbortError') {
        title = 'Device Access Aborted';
        msg = 'The video connection attempt was aborted.';
      }

      showToast(title, msg);
      return { title, msg };
    }

    async function scanAndSelectCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showToast('WebRTC Unsupported', 'Your browser does not support mediaDevices API.');
        return;
      }

      btnStartVideo.innerHTML = '<span>⏳</span> Scanning devices...';
      btnStartVideo.disabled = true;

      try {
        let devices = await navigator.mediaDevices.enumerateDevices();
        let videoDevices = devices.filter(d => d.kind === 'videoinput');

        // If labels are empty, prompt camera permission once to unlock hardware names
        if (videoDevices.length === 0 || !videoDevices[0].label) {
          try {
            const tempStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
            tempStream.getTracks().forEach(t => t.stop());
            await new Promise(r => setTimeout(r, 100));
            devices = await navigator.mediaDevices.enumerateDevices();
            videoDevices = devices.filter(d => d.kind === 'videoinput');
          } catch (permErr) {
            handleCameraError(permErr, 'Camera Scan');
            btnStartVideo.innerHTML = '<span>📹</span> Start Video Stream';
            btnStartVideo.disabled = false;
            return;
          }
        }

        if (videoDevices.length === 0) {
          showToast('No Video Device Found', 'No UVC capture card or camera detected. Please check the USB connection.');
          btnStartVideo.innerHTML = '<span>📹</span> Start Video Stream';
          btnStartVideo.disabled = false;
          return;
        }

        // If only 1 video device is found, directly connect to it
        if (videoDevices.length === 1) {
          await connectCamera(videoDevices[0].deviceId, videoDevices[0].label);
          return;
        }

        // Multiple video devices: open the selection modal
        openDeviceModal(videoDevices);
      } catch (err) {
        handleCameraError(err, 'Scan');
        btnStartVideo.innerHTML = '<span>📹</span> Start Video Stream';
        btnStartVideo.disabled = false;
      }
    }

    async function connectCamera(deviceId, label) {
      try {
        if (currentStream) {
          currentStream.getTracks().forEach(t => t.stop());
          currentStream = null;
          await new Promise(r => setTimeout(r, 80));
        }

        // Fallback constraint tiers to handle device-specific capabilities without OverconstrainedError
        const constraintTiers = [
          // Tier 1: Targeted device with ideal 1080p
          {
            video: {
              deviceId: deviceId ? { exact: deviceId } : undefined,
              width: { ideal: 1920 },
              height: { ideal: 1080 }
            },
            audio: false
          },
          // Tier 2: Targeted device with native resolution
          {
            video: {
              deviceId: deviceId ? { exact: deviceId } : undefined
            },
            audio: false
          },
          // Tier 3: Relaxed ideal deviceId
          {
            video: {
              deviceId: deviceId ? { ideal: deviceId } : undefined
            },
            audio: false
          },
          // Tier 4: Fallback to any default video device
          {
            video: true,
            audio: false
          }
        ];

        let stream = null;
        let lastErr = null;

        for (const constraints of constraintTiers) {
          try {
            stream = await navigator.mediaDevices.getUserMedia(constraints);
            if (stream) break;
          } catch (err) {
            lastErr = err;
            console.warn('[KVM Video] Constraint attempt failed:', err.name, err.constraint || '', constraints);
          }
        }

        if (!stream) {
          throw lastErr || new Error('Could not acquire video stream');
        }

        currentStream = stream;
        videoEl.srcObject = stream;

        const videoTrack = stream.getVideoTracks()[0];
        const settings = videoTrack.getSettings ? videoTrack.getSettings() : {};
        const deviceName = label ? label.split('(')[0].trim() : (videoTrack.label ? videoTrack.label.split('(')[0].trim() : 'Video');
        const resText = settings.width && settings.height ? ` (${settings.width}x${settings.height})` : '';

        updateVideoUI(true, `${deviceName}: Active${resText}`);

        videoTrack.addEventListener('ended', () => {
          console.log('[KVM Video] Track ended (camera unplugged or stream stopped)');
          stopVideo('UVC capture device unplugged or stream terminated.');
        });

        videoTrack.addEventListener('mute', () => {
          updateVideoUI(true, `${deviceName}: Muted/Waiting`);
        });
        videoTrack.addEventListener('unmute', () => {
          updateVideoUI(true, `${deviceName}: Active${resText}`);
        });

        console.log('[KVM Video] Stream started successfully on device:', deviceName);
      } catch (err) {
        const { msg } = handleCameraError(err, 'Connection');
        stopVideo('Could not start video stream: ' + msg);
      } finally {
        btnStartVideo.innerHTML = '<span>📹</span> Start Video Stream';
        btnStartVideo.disabled = false;
      }
    }

    function stopVideo(reason) {
      const wasStreaming = !!currentStream;
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
        currentStream = null;
      }
      videoEl.srcObject = null;
      updateVideoUI(false);
      if (wasStreaming) {
        showToast('Video Stream Disconnected', reason || 'UVC video stream has ended.');
      }
      console.log('[KVM Video] Stream stopped:', reason || 'Normal');
    }

    btnStartVideo.addEventListener('click', scanAndSelectCamera);
    btnStopVideo.addEventListener('click', () => stopVideo('Video stream stopped by user.'));

    // Hook: Listen for global media devices changes (plug/unplug)
    if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
      navigator.mediaDevices.addEventListener('devicechange', async () => {
        console.log('[KVM Video] Media device change event detected');
        if (currentStream) {
          const devices = await navigator.mediaDevices.enumerateDevices();
          const hasVideo = devices.some(d => d.kind === 'videoinput');
          if (!hasVideo) {
            console.warn('[KVM Video] No video input devices found, stopping stream');
            stopVideo('UVC capture device was removed.');
          }
        }
      });
    }

    // -------------------------------------------------------------------------
    // 2. Web Serial Setup, Hooks & Echo Reader
    // -------------------------------------------------------------------------
    async function startReading() {
      if (!port || !port.readable) return;
      const textDecoder = new TextDecoder();
      let rxBuffer = '';
      try {
        reader = port.readable.getReader();
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          if (value) {
            rxBuffer += textDecoder.decode(value, { stream: true });
            const lines = rxBuffer.split(/\r?\n/);
            rxBuffer = lines.pop(); // keep partial line for next chunk
            for (const line of lines) {
              const trimmed = line.trim();
              if (trimmed.length > 0) {
                console.log('%c[RP2350 Echo]', 'color: #00ffaa; font-weight: bold;', trimmed);

                // Parse firmware status updates to update UI badge text
                if (trimmed.includes('heartbeat')) {
                  const pioReady = trimmed.includes('pio_ready=1');
                  serialStatusText.textContent = pioReady
                    ? 'RP2350: Ready (Target PC OK)'
                    : 'RP2350: Connected (Waiting Target)';
                } else if (trimmed.includes('configured HID endpoints successfully')) {
                  serialStatusText.textContent = 'RP2350: Ready (Target PC OK)';
                } else if (trimmed.includes('Target PC bus reset')) {
                  serialStatusText.textContent = 'RP2350: Connected (Target Reset)';
                }

                if (echoStatusEl) {
                  echoStatusEl.textContent = 'Echo: ' + trimmed;
                }
              }
            }
          }
        }
      } catch (err) {
        console.warn('[KVM Serial] Read loop stopped:', err);
      } finally {
        if (reader) {
          try { reader.releaseLock(); } catch (e) {}
          reader = null;
        }
        handleSerialDisconnected('RP2350 serial connection closed.');
      }
    }

    async function connectSerial() {
      if (!navigator.serial) {
        showToast('Web Serial Unsupported', 'Please use Chrome, Edge, or Opera for Web Serial support.');
        return;
      }
      try {
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 115200 });

        try {
          await port.setSignals({ dataTerminalReady: true, requestToSend: true });
        } catch (sigErr) {
          console.warn('[KVM Serial] Could not set DTR/RTS signals:', sigErr);
        }

        writer = port.writable.getWriter();
        updateSerialUI(true, 'RP2350: Connected');
        console.log('[KVM Serial] Connected to RP2350');
        startReading();
      } catch (err) {
        console.error('[KVM Serial] Connection error:', err);
        handleSerialDisconnected('Failed to connect to RP2350: ' + err.message);
      }
    }

    async function disconnectSerial(reason) {
      try {
        if (writer) {
          await writer.close().catch(() => {});
          writer = null;
        }
        if (reader) {
          await reader.cancel().catch(() => {});
          reader = null;
        }
        if (port) {
          await port.close().catch(() => {});
          port = null;
        }
      } catch (err) {
        console.warn('[KVM Serial] Disconnect cleanup error:', err);
      }
      handleSerialDisconnected(reason || 'RP2350 serial disconnected by user.');
    }

    function handleSerialDisconnected(reason) {
      const wasConnected = !!port;
      writer = null;
      reader = null;
      port = null;
      updateSerialUI(false);
      if (wasConnected) {
        showToast('RP2350 Serial Disconnected', reason || 'Serial connection closed.');
      }
      console.log('[KVM Serial] Serial port disconnected:', reason || 'Normal');
    }

    btnConnectSerial.addEventListener('click', connectSerial);
    btnDisconnectSerial.addEventListener('click', () => disconnectSerial('RP2350 serial disconnected by user.'));

    // Hook: Listen for serial device disconnect (hardware unplug)
    if (navigator.serial) {
      navigator.serial.addEventListener('disconnect', (event) => {
        console.log('[KVM Serial] Hardware disconnect hook triggered:', event);
        if (port && event.target === port) {
          console.warn('[KVM Serial] Connected RP2350 was unplugged!');
          disconnectSerial('RP2350 device was physically unplugged from USB.');
        }
      });

      // Hook: Listen for serial device connect (hardware plug)
      navigator.serial.addEventListener('connect', (event) => {
        console.log('[KVM Serial] New serial device plugged in:', event);
      });
    }

    // Helper: Send Serial Packet
    async function sendPacket(bytes) {
      if (!writer) {
        return;
      }
      try {
        await writer.write(new Uint8Array(bytes));
      } catch (err) {
        console.error('[KVM Serial] Write error:', err);
      }
    }

    // -------------------------------------------------------------------------
    // 3. Pointer Lock & Input Capture Indicator Hooks
    // -------------------------------------------------------------------------
    videoEl.addEventListener('click', () => {
      videoEl.requestPointerLock();
      if (navigator.keyboard && navigator.keyboard.lock) {
        navigator.keyboard.lock(['Escape', 'AltLeft', 'AltRight', 'Tab']);
      }
    });

    document.addEventListener('pointerlockchange', () => {
      const isLocked = document.pointerLockElement === videoEl;
      if (isLocked) {
        kvmIndicator.classList.add('locked');
        kvmLockText.textContent = 'Input Forwarding Active (ESC to release)';
      } else {
        kvmIndicator.classList.remove('locked');
        kvmLockText.textContent = 'Click video to focus KVM';
      }
    });

    // -------------------------------------------------------------------------
    // 4. Mouse Input Handling
    // -------------------------------------------------------------------------
    window.addEventListener('mousemove', (e) => {
      if (document.pointerLockElement !== videoEl) return;
      const dx = Math.max(-127, Math.min(127, e.movementX));
      const dy = Math.max(-127, Math.min(127, e.movementY));
      // Packet: [0x02, buttons, dx, dy, wheel]
      const packet = [0x02, e.buttons, dx & 0xFF, dy & 0xFF, 0x00];
      sendPacket(packet);
    });

    window.addEventListener('mousedown', (e) => {
      if (document.pointerLockElement !== videoEl) return;
      const packet = [0x02, e.buttons, 0x00, 0x00, 0x00];
      sendPacket(packet);
    });

    window.addEventListener('mouseup', (e) => {
      if (document.pointerLockElement !== videoEl) return;
      const packet = [0x02, e.buttons, 0x00, 0x00, 0x00];
      sendPacket(packet);
    });

    window.addEventListener('wheel', (e) => {
      if (document.pointerLockElement !== videoEl) return;
      const wheelDelta = e.deltaY < 0 ? 1 : (e.deltaY > 0 ? -1 : 0);
      const packet = [0x02, e.buttons, 0x00, 0x00, wheelDelta & 0xFF];
      sendPacket(packet);
    });

    // -------------------------------------------------------------------------
    // 5. Keyboard Translation (USB HID Scancodes)
    // -------------------------------------------------------------------------
    const KEY_MAP = {
      // Letters A-Z
      'KeyA': 0x04, 'KeyB': 0x05, 'KeyC': 0x06, 'KeyD': 0x07,
      'KeyE': 0x08, 'KeyF': 0x09, 'KeyG': 0x0A, 'KeyH': 0x0B,
      'KeyI': 0x0C, 'KeyJ': 0x0D, 'KeyK': 0x0E, 'KeyL': 0x0F,
      'KeyM': 0x10, 'KeyN': 0x11, 'KeyO': 0x12, 'KeyP': 0x13,
      'KeyQ': 0x14, 'KeyR': 0x15, 'KeyS': 0x16, 'KeyT': 0x17,
      'KeyU': 0x18, 'KeyV': 0x19, 'KeyW': 0x1A, 'KeyX': 0x1B,
      'KeyY': 0x1C, 'KeyZ': 0x1D,
      // Digits 1-0
      'Digit1': 0x1E, 'Digit2': 0x1F, 'Digit3': 0x20, 'Digit4': 0x21,
      'Digit5': 0x22, 'Digit6': 0x23, 'Digit7': 0x24, 'Digit8': 0x25,
      'Digit9': 0x26, 'Digit0': 0x27,
      // Common controls
      'Enter': 0x28, 'Escape': 0x29, 'Backspace': 0x2A, 'Tab': 0x2B, 'Space': 0x2C,
      'Minus': 0x2D, 'Equal': 0x2E, 'BracketLeft': 0x2F, 'BracketRight': 0x30,
      'Backslash': 0x31, 'Semicolon': 0x33, 'Quote': 0x34, 'Backquote': 0x35,
      'Comma': 0x36, 'Period': 0x37, 'Slash': 0x38, 'CapsLock': 0x39,
      // Function keys
      'F1': 0x3A, 'F2': 0x3B, 'F3': 0x3C, 'F4': 0x3D,
      'F5': 0x3E, 'F6': 0x3F, 'F7': 0x40, 'F8': 0x41,
      'F9': 0x42, 'F10': 0x43, 'F11': 0x44, 'F12': 0x45,
      // Navigation
      'PrintScreen': 0x46, 'ScrollLock': 0x47, 'Pause': 0x48,
      'Insert': 0x49, 'Home': 0x4A, 'PageUp': 0x4B,
      'Delete': 0x4C, 'End': 0x4D, 'PageDown': 0x4E,
      // Arrows
      'ArrowRight': 0x4F, 'ArrowLeft': 0x50, 'ArrowDown': 0x51, 'ArrowUp': 0x52
    };

    function getModifiers(e) {
      let mask = 0;
      if (e.ctrlKey) mask |= 0x01;
      if (e.shiftKey) mask |= 0x02;
      if (e.altKey) mask |= 0x04;
      if (e.metaKey) mask |= 0x08;
      return mask;
    }

    window.addEventListener('keydown', (e) => {
      if (document.pointerLockElement !== videoEl) {
        return;
      }
      e.preventDefault();
      const code = KEY_MAP[e.code] || 0x00;
      const mod = getModifiers(e);
      const packet = [0x01, mod, 0x00, code, 0x00];
      sendPacket(packet);
    });

    window.addEventListener('keyup', (e) => {
      if (document.pointerLockElement !== videoEl) return;
      e.preventDefault();
      const code = KEY_MAP[e.code] || 0x00;
      const mod = getModifiers(e);
      const packet = [0x01, mod, 0x00, 0x00, 0x00];
      sendPacket(packet);
    });
  </script>
</body>
